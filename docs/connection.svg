<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" role="img" aria-labelledby="title desc"><title id="title">How the printer and exhaust fan connect</title><desc id="desc">The H2D sends local MQTT status to a Python listener on a Mac. The listener sends fan commands through the Smart Life cloud service to the external inline fan.</desc><rect width="880" height="210" rx="10" fill="#edf2eb"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#cad8ca"><rect x="24" y="56" width="164" height="102" rx="10"/><rect x="246" y="56" width="164" height="102" rx="10"/><rect x="468" y="56" width="164" height="102" rx="10"/><rect x="690" y="56" width="164" height="102" rx="10"/></g><g fill="#20352e" font-size="17" font-weight="600"><text x="106" y="96">H2D</text><text x="328" y="96">Python listener</text><text x="550" y="96">Smart Life</text><text x="772" y="96">Inline fan</text></g><g fill="#65736b" font-size="12"><text x="106" y="123">Printer status</text><text x="328" y="123">Mac home server</text><text x="550" y="123">Tuya cloud service</text><text x="772" y="123">On/off + speed</text><text x="217" y="76">MQTT</text><text x="439" y="76">Command</text><text x="661" y="76">Wi-Fi</text></g><g fill="#167358" font-size="28"><text x="217" y="116">→</text><text x="439" y="116">→</text><text x="661" y="116">→</text></g><text x="440" y="187" fill="#65736b" font-size="11">Local printer connection · Cloud fan control</text></g></svg>
